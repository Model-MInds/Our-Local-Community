<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
      <link rel="preconnect" href="https://fonts.googleapis.com">
    <title>Contact Us - OCL</title>
    <link rel="shortcut icon" href="../images/download.png">
</head>
<body>
    <button type="button" class="go-back-btn" onclick="history.back()"><i class="fa fa-arrow-left"></i> Go Back</button>

<section id="contact" class="contact">
        <h2>Contact Us</h2>
        <form id="contact-form">
            <input type="text" placeholder="Your Name:" required><br>
            <input type="email" placeholder="Email Address:" required><br>
            <input type="number"placeholder="Contact Number:"required><br>
             <input type="text"placeholder="Location:"required><br>
            <textarea placeholder="Description:"></textarea><br>

            <button type="submit" class="btn">Send</button><br>
        </form>
    </section>
</body>
</html>
